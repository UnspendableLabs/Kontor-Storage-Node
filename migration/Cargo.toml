[package]
name = "migration"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"

[dependencies.sea-orm-migration]
version = "2.0.0-rc.7"
features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
]

