name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Defined in gates.yml, so that the release workflow runs the same checks
  # from the same file rather than from a copy of it.
  gates:
    uses: ./.github/workflows/gates.yml

  # Deliberately *not* a gate of the release: the gates already run the suite.
  # This job measures coverage and fails under 95% of lines — high enough that
  # untested code still gets caught, low enough that it does not report on
  # branches no test can reach (a poisoned mutex, an unreachable `map_err`).
  # The table and the uncovered lines are in its log; nothing is uploaded to a
  # third party.
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --locked --show-missing-lines --fail-under-lines 95
