name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Defined in gates.yml, so that the release workflow runs the same checks
  # from the same file rather than from a copy of it.
  gates:
    uses: ./.github/workflows/gates.yml

  # Deliberately *not* a gate. Coverage is a property of the repository over
  # time and depends on a third-party service being up; a release that could
  # not go out because Codecov was down would be the tail wagging the dog. It
  # still fails the build on a push, which is where it does its work.
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    environment: default
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info --show-missing-lines
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
