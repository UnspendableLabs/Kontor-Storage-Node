[package]
name = "kontor-storage-node"
version = "0.1.0"
edition = "2021"
# Set by `home 0.5.12`, which arrives under `sqlx-postgres` (via `etcetera`, for
# `~/.pgpass`). Compiling the Postgres and MySQL drivers in is what makes the
# `DATABASE_URL` values this README advertises actually connect, and this is
# their price. Everything else in the graph tops out at 1.85.
rust-version = "1.88"
description = "Storage node for the Kontor distributed storage network: stores files under contract, answers challenges with BLS proofs, and configures itself from a browser."
authors = ["Unspendable Labs"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/UnspendableLabs/Kontor-Storage-Node"
homepage = "https://github.com/UnspendableLabs/Kontor-Storage-Node"
documentation = "https://github.com/UnspendableLabs/Kontor-Storage-Node#readme"
readme = "README.md"
keywords = ["kontor", "storage", "node", "bitcoin", "proof-of-storage"]
categories = ["command-line-utilities", "cryptography", "database"]
# The published tarball is the node and what it serves, nothing else. The API
# blueprint, the CI plumbing and the browser-half test harness are part of
# developing this crate, not of running it.
exclude = [
    "/.github",
    "/.githooks",
    "/apiary.apib",
    "/codecov.yml",
    "/scripts",
    "/tests",
    # Kept out deliberately. `cargo install` never reads it — rustup picks a
    # toolchain from the working directory, not from the crate it is building —
    # but anyone who unpacks the tarball and builds it would have 1.95.0 forced
    # on them by a file they did not write, which is the opposite of what
    # `rust-version` above promises.
    "/rust-toolchain.toml",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace]
members = ["."]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "net"] }
bytes = "1.6"
axum = { version = "0.7", features = ["macros"] }
tokio-util = "0.7"
futures-util = "0.3"
ff = "0.13"
hex = "0.4"
# A node runs on SQLite; `migrate` exists for the operators who point it at a
# shared Postgres or MySQL instead, so all three drivers have to be compiled in.
# `Database::connect` dispatches on `#[cfg(feature)]` alone: without the arm for
# a scheme, it does not fail to authenticate, it answers "has no supporting
# driver" for every URL of that shape.
#
# Pinned exactly, and only because it is a release candidate. `cargo install`
# re-resolves — the same reason `rust-version` above cannot rely on the
# lockfile — so `2.0.0-rc.7` would have meant "whatever rc, or the 2.0.0 final,
# that exists on the day someone installs this". Between two release candidates
# that is a coin toss on the API, and the failure lands on the installing user,
# not on CI. Bumping this is a deliberate act with the tests run against it.
#
# Pinning it also *moved* it: the caret on `rc.7` had been resolving to `rc.21`
# through the lockfile for some time, so `rc.21` is the version the suite has
# actually been running against and the one now written down. Unpin when 2.0.0
# is final — an exact pin on a prerelease stops any consumer converging on the
# release, which matters the moment this crate is a dependency and not just a
# binary.
sea-orm = { version = "=2.0.0-rc.21", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "runtime-tokio-rustls",
    "macros"
] }
# The features must be named here, not inherited. They used to arrive through
# feature unification with the separate `migration` crate; now that it is a
# module, nothing else asks for them, and without `sqlx-sqlite` the schema
# manager answers "operation not supported by backend Sqlite".
# `default-features = false` drops the `cli` feature, and with it the whole
# `sea-orm-cli` binary. Nothing needs it: the `cli` feature exists to build a
# `sea-orm-cli`-style migration binary, which the `migrate` subcommand replaced.
# Pinned with `sea-orm`, and to the same release candidate: the two share a
# `sea-query` and a `sqlx`, and a mismatched pair is a type error in a
# dependency rather than a message anyone can act on.
sea-orm-migration = { version = "=2.0.0-rc.21", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
byte-unit = "4.0"
# Must be the SAME crate Kontor's `kontor-indexer` resolves (crates.io
# `kontor-crypto`, see Kontor `core/indexer/Cargo.toml`) and the same one the
# Horizon Portal builds against: the node is the prover and the filestorage
# contract is the verifier, so a version skew means proofs that never verify.
kontor-crypto = "0.3.0"
jsonwebtoken = "9"
# Constant-time comparison for the admin password (already in the tree via
# aes-gcm; named here because the login path depends on it directly).
subtle = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
http = "1.1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"
# BLS key management
blst = "0.3"
aes-gcm = "0.10"
aes = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
ctr = "0.9"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive", "serde"] }
rpassword = "7.3"
# Mnemonic-derived identity, byte-compatible with Horizon Wallet. All pure Rust:
# the node deliberately keeps `bitcoin` and its secp256k1 C bindings out of the
# tree (see `node::registration::x_only_from_xpub`).
# `bip32`'s own mnemonic type only accepts 24-word phrases (it hardcodes 256-bit
# entropy), and Horizon Wallet issues 12-word ones, so BIP-39 comes from `bip39`
# and `bip32` is used only for BIP32 derivation and xpub serialization.
bip39 = "2"
bip32 = { version = "0.5", default-features = false, features = ["std", "secp256k1"] }
k256 = { version = "0.13", features = ["schnorr"] }
# P-256 ECDH + HKDF: the sealed envelope the setup wizard posts a mnemonic
# through. P-256 rather than X25519 because WebCrypto supports it in every
# browser, and the page must run with no external script at all.
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"
bech32 = "0.11"
# HTTP signature (RFC 9421)
base64 = "0.22"
uuid = { version = "1.11", features = ["v4"] }
postcard = { version = "1.1", features = ["alloc"] }
tower-http = { version = "0.6", features = ["cors"] }
# The dashboard's CSS, JS and logo, compiled into the binary rather than read
# from `./static` at runtime — see `server::assets`. `debug-embed` makes debug
# builds embed too, so the tests exercise the same bytes a release serves
# instead of the working directory's.
rust-embed = { version = "8", features = ["debug-embed", "mime-guess"] }

# Only for `flock`, which is how the daemon lock tells a live holder from one
# left behind by a SIGKILL — the kernel releases it either way. Already in the
# tree via tokio, so naming it here costs nothing to build.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
serial_test = "2"
pasta_curves = "0.5"
halo2curves = "0.8"
http-body-util = "0.1"
tempfile = "3.13"
tower = { version = "0.5", features = ["util"] }
assert_cmd = "2.0"

# Optimize crypto dependencies even in dev/test builds to avoid extremely
# slow execution under coverage instrumentation (cargo llvm-cov).
[profile.dev.package.kontor-crypto]
opt-level = 3

[profile.dev.package.ff]
opt-level = 3

[profile.dev.package.halo2curves]
opt-level = 3

[profile.dev.package.pasta_curves]
opt-level = 3
