[package]
name = "Kontor-Storage-Node"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "migration"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "fs", "time", "signal", "net"] }
bytes = "1.6"
axum = { version = "0.7", features = ["macros"] }
tokio-util = "0.7"
futures-util = "0.3"
ff = "0.13"
hex = "0.4"
sea-orm = { version = "2.0.0-rc.7", features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "sqlx-mysql",
    "runtime-tokio-rustls",
    "macros"
] }
sea-orm-migration = "2.0.0-rc.7"
migration = { path = "migration" }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
byte-unit = "4.0"
kontor-crypto = { path = "../Kontor-Crypto" }
jsonwebtoken = "9"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
http = "1.1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
rand = "0.8"

[dev-dependencies]
wiremock = "0.6"
serial_test = "2"
pasta_curves = "0.5"
halo2curves = "0.8"
http-body-util = "0.1"
tempfile = "3.13"
tower = { version = "0.5", features = ["util"] }
assert_cmd = "2.0"

# Optimize crypto dependencies even in dev/test builds to avoid extremely
# slow execution under coverage instrumentation (cargo llvm-cov).
[profile.dev.package.kontor-crypto]
opt-level = 3

[profile.dev.package.ff]
opt-level = 3

[profile.dev.package.halo2curves]
opt-level = 3

[profile.dev.package.pasta_curves]
opt-level = 3
